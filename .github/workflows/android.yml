# Build the 大肥鱼直播 debug APK (com.dl1991.feiyu) and upload it.
name: Android

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-android's default package list includes the removed 'tools'
      # package, which makes sdkmanager fail; name the packages explicitly.
      - name: Set up Android SDK (platform 36, build-tools 35)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # One fixed signing key for every build (Actions secret, never in git)
      # so new APKs install over old ones.
      - name: Signing keystore
        env:
          KS: ${{ secrets.MIBOT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/mibot.p12"
            echo "MIBOT_KEYSTORE_FILE=$RUNNER_TEMP/mibot.p12" >> "$GITHUB_ENV"
            echo "fixed signing key: yes"
          else
            echo "::warning::MIBOT_KEYSTORE_B64 not set; using the runner's debug key"
          fi

      - name: assembleDebug
        env:
          MIBOT_KEYSTORE_PASSWORD: ${{ secrets.MIBOT_KEYSTORE_PASSWORD }}
          MIBOT_KEY_ALIAS: ${{ secrets.MIBOT_KEY_ALIAS }}
          MIBOT_KEY_PASSWORD: ${{ secrets.MIBOT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Collect APK
        run: |
          mkdir -p out
          cp $(find app/build/outputs/apk -name '*.apk' | head -n1) out/feiyu-live-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/feiyu-live-debug.apk | tee out/signing.txt || true
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: feiyu-live-debug-apk
          path: |
            out/feiyu-live-debug.apk
            out/signing.txt
          retention-days: 14

      # JVM unit tests: tool-call parsing/validation + a scripted mini-stream through the 直播专家组 (fake model).
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

  # Emulator smoke: a full agent loop with simulated viewers + screenshots. Informational (never blocks the APK).
  smoke:
    name: Emulator smoke (agent loop)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: feiyu-live-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/smoke.sh
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feiyu-smoke
          path: out/smoke
          retention-days: 14
